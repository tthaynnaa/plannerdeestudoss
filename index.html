<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner de Estudos Thay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FB;
  --bg-soft:#FAFCFE;
  --surface:#FFFFFF;
  --surface-2:#EDF3F8;
  --border:#E1EAF1;
  --border-soft:#EAF1F6;
  --text:#26313A;
  --text-soft:#63737F;
  --text-faint:#9AABB5;

  --primary:#8FBFE0;
  --primary-deep:#4A80AC;
  --primary-tint:#E9F3FA;
  --primary-ink:#2C5876;

  --mint:#8FCBAE;
  --mint-deep:#4E9973;
  --mint-tint:#E6F5EC;

  --amber:#F0C778;
  --amber-deep:#B4842A;
  --amber-tint:#FBF3DE;

  --rose:#EFA6AC;
  --rose-deep:#C05C66;
  --rose-tint:#FBEAEC;

  --sky:#8FD3DC;
  --sky-deep:#2C8D96;
  --sky-tint:#E6F7F8;

  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-sm:0 1px 2px rgba(38,49,58,.05);
  --shadow-md:0 10px 30px -14px rgba(46,86,112,.22);
  --shadow-lg:0 22px 50px -20px rgba(46,86,112,.28);
}
body.dark{
  --bg:#171C22;
  --bg-soft:#1C2229;
  --surface:#20272F;
  --surface-2:#28313A;
  --border:#374350;
  --border-soft:#2E3841;
  --text:#EAF1F6;
  --text-soft:#AAB8C2;
  --text-faint:#6D7C87;
  --primary-tint:#213747;
  --mint-tint:#1E332A;
  --amber-tint:#332C1B;
  --rose-tint:#33232A;
  --sky-tint:#1B3336;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:'Lora',serif; margin:0; font-weight:600; color:var(--text);}
p{margin:0;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary-tint); color:var(--primary-ink);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.hidden{display:none !important;}

/* ---------- Buttons & basics ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  padding:11px 18px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-weight:600; font-size:14px;
  transition:all .15s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--primary); color:var(--primary-deep); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn svg{width:16px; height:16px; flex-shrink:0;}
.btn-primary{
  background:linear-gradient(180deg, var(--primary), var(--primary-deep));
  border-color:transparent; color:#fff; box-shadow:var(--shadow-sm);
}
.btn-primary:hover{color:#fff; filter:brightness(1.06); box-shadow:var(--shadow-md);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2); border-color:transparent; color:var(--text);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:10px;}
.btn-block{width:100%;}
.btn-danger-ghost{color:var(--rose-deep);}
.btn-danger-ghost:hover{border-color:var(--rose); color:var(--rose-deep);}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{font-size:13px; font-weight:600; color:var(--text-soft);}
.field input, .field select, .field textarea{
  padding:11px 14px; border-radius:11px; border:1px solid var(--border);
  background:var(--bg-soft); color:var(--text); font-size:14.5px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);
}
.field-row{display:flex; gap:14px;}
.field-row .field{flex:1;}
.ta-plain{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg-soft); color:var(--text); font-size:13.8px; font-family:inherit; resize:vertical; outline:none;}
.ta-plain:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);}

.card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-m); padding:22px; box-shadow:var(--shadow-sm);
}
.card-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px;}
.card-title-row h3{font-size:17px;}
.eyebrow{font-size:12.5px; color:var(--text-faint); font-weight:600;}

.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:100px; font-size:12.5px; font-weight:600;}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block;}
.dot-faint{background:var(--text-faint);}
.dot-sky{background:var(--sky-deep);}
.dot-amber{background:var(--amber-deep);}
.dot-mint{background:var(--mint-deep);}
.dot-rose{background:var(--rose-deep);}
.badge-faint{background:var(--surface-2); color:var(--text-soft);}
.badge-sky{background:var(--sky-tint); color:var(--sky-deep);}
.badge-amber{background:var(--amber-tint); color:var(--amber-deep);}
.badge-mint{background:var(--mint-tint); color:var(--mint-deep);}
.badge-rose{background:var(--rose-tint); color:var(--rose-deep);}

.status-select{border:none; border-radius:100px; padding:5px 12px 5px 10px; font-size:12.5px; font-weight:700; cursor:pointer; outline:none; appearance:none; -webkit-appearance:none;}

.progress{height:8px; background:var(--surface-2); border-radius:100px; overflow:hidden;}
.progress > span{display:block; height:100%; border-radius:100px; background:linear-gradient(90deg, var(--primary), var(--primary-deep));}
.progress.mint > span{background:linear-gradient(90deg, var(--mint), var(--mint-deep));}
.progress.amber > span{background:linear-gradient(90deg, var(--amber), var(--amber-deep));}

.grid{display:grid; gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.avatar{width:38px; height:38px; border-radius:50%; background:var(--primary-tint); color:var(--primary-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}

/* ---------- App shell ---------- */
#app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border-soft);
  padding:22px 16px; display:flex; flex-direction:column; gap:22px; position:fixed; top:0; bottom:0; left:0;
  overflow-y:auto; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px;}
.brand-mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(160deg, var(--primary), var(--primary-deep)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Lora',serif; font-weight:700; font-size:17px; box-shadow:var(--shadow-sm); flex-shrink:0;}
.brand-name{display:flex; flex-direction:column; line-height:1.2;}
.brand-line1{font-size:11px; color:var(--text-faint); font-weight:600;}
.brand-line2{font-family:'Lora',serif; font-weight:700; font-size:18.5px; color:var(--primary-deep);}

.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--text-soft); font-weight:600; font-size:14.5px; transition:all .15s ease;}
.nav-item svg{width:19px; height:19px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--primary-tint); color:var(--primary-ink);}
.sidebar-footer{margin-top:auto;}
.contest-mini{background:var(--surface-2); border-radius:14px; padding:13px; font-size:12.5px; color:var(--text-soft);}
.contest-mini strong{display:block; color:var(--text); font-size:13.5px; margin-bottom:2px; font-family:'Lora',serif;}

.main{margin-left:250px; flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 36px 0;}
.topbar h1{font-size:25px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.icon-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-soft);}
.icon-btn svg{width:18px; height:18px;}
.icon-btn:hover{color:var(--primary-deep); border-color:var(--primary);}

.mini-trash{width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); border:none; background:transparent; border-radius:6px; flex-shrink:0;}
.mini-trash svg{width:13px; height:13px;}
.mini-trash:hover{color:var(--rose-deep); background:var(--rose-tint);}

.content{padding:24px 36px 60px; flex:1;}
.view{display:none;}
.view.active{display:block;}

@media (max-width:960px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .topbar{padding:20px 18px 0;}
  .content{padding:18px 18px 100px;}
  .topbar h1{font-size:21px;}
}

.enter-seq > *{opacity:0; transform:translateY(10px); animation:enterUp .5s ease forwards;}
.enter-seq > *:nth-child(1){animation-delay:.02s;}
.enter-seq > *:nth-child(2){animation-delay:.08s;}
.enter-seq > *:nth-child(3){animation-delay:.14s;}
.enter-seq > *:nth-child(4){animation-delay:.2s;}
@keyframes enterUp{to{opacity:1; transform:translateY(0);}}

.bottom-nav{display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border-soft); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50; box-shadow:0 -8px 24px -18px rgba(38,49,58,.3);}
@media (max-width:960px){.bottom-nav{display:flex; justify-content:space-around;}}
.bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px;}
.bn-item svg{width:20px; height:20px;}
.bn-item.active{color:var(--primary-deep);}

.drawer-overlay{position:fixed; inset:0; background:rgba(20,26,32,.4); z-index:60; display:none;}
.drawer-overlay.active{display:block;}
.drawer{position:fixed; right:0; top:0; bottom:0; width:78%; max-width:300px; background:var(--surface); padding:20px 16px; overflow-y:auto; box-shadow:var(--shadow-lg);}

/* ---------- Dashboard ---------- */
.hero-row{display:grid; grid-template-columns:2fr 1fr; gap:18px; margin-bottom:18px;}
@media (max-width:960px){.hero-row{grid-template-columns:1fr;}}
.contest-card{background:linear-gradient(135deg, var(--primary-tint), var(--surface) 60%); border:1px solid var(--border-soft); border-radius:var(--radius-l); padding:26px; display:flex; flex-direction:column; gap:12px; justify-content:center;}
.contest-card .kicker{font-size:12.5px; font-weight:700; color:var(--primary-deep);}
.contest-card h2{font-size:21px; margin-top:2px;}
.contest-meta{display:flex; flex-wrap:wrap; gap:22px; margin-top:6px;}
.contest-meta div span{display:block; font-size:11.5px; color:var(--text-faint); font-weight:600; margin-bottom:2px;}
.contest-meta div strong{font-size:14.5px; font-family:'Lora',serif;}
.countdown-card{border-radius:var(--radius-l); padding:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:var(--surface); border:1px solid var(--border-soft); gap:6px;}
.countdown-num{font-family:'Lora',serif; font-size:48px; font-weight:700; color:var(--primary-deep); line-height:1;}
.countdown-card p{color:var(--text-soft); font-size:14px;}

.stat-card{display:flex; flex-direction:column; gap:8px;}
.stat-card .stat-top{display:flex; align-items:center; justify-content:space-between;}
.stat-card .stat-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
.stat-card .stat-icon svg{width:17px; height:17px;}
.stat-card .stat-num{font-family:'Lora',serif; font-size:24px; font-weight:700;}
.stat-card .stat-label{font-size:13px; color:var(--text-soft);}

.prep-banner{border-radius:var(--radius-m); padding:20px; display:flex; align-items:flex-start; gap:14px;}
.prep-banner .prep-icon{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--surface);}
.prep-banner .prep-icon svg{width:22px; height:22px;}
.prep-banner h4{font-size:16px; margin-bottom:3px;}
.prep-banner p{font-size:13.8px; color:var(--text-soft); line-height:1.5;}

.reco-card{border-radius:var(--radius-l); padding:28px; background:linear-gradient(135deg, var(--primary-deep), #34617F); color:#fff; display:flex; justify-content:space-between; gap:24px; align-items:center; box-shadow:var(--shadow-md);}
.reco-card .kicker{font-size:12.5px; font-weight:700; opacity:.85; display:flex; align-items:center; gap:8px;}
.reco-card h3{color:#fff; font-size:20px; margin:8px 0 6px;}
.reco-card p{opacity:.88; font-size:14px; max-width:480px; line-height:1.5;}
.reco-tasks{display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;}
.reco-tasks div{font-size:13px; opacity:.9; display:flex; align-items:center; gap:6px;}
.reco-card .btn-primary{background:#fff; color:var(--primary-deep); box-shadow:none; flex-shrink:0;}
.reco-card .btn-primary:hover{color:var(--primary-deep); filter:none; background:#f2f8fc;}
@media (max-width:760px){.reco-card{flex-direction:column; align-items:flex-start;}}
.chart-wrap{width:100%; height:210px; display:flex; align-items:center; justify-content:center;}

.gam-row{display:flex; gap:16px; flex-wrap:wrap;}
.gam-chip{display:flex; align-items:center; gap:10px; background:var(--surface-2); padding:10px 16px; border-radius:100px; font-size:13.5px; font-weight:700;}
.gam-chip svg{width:17px; height:17px;}
.achv-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;}
@media (max-width:760px){.achv-grid{grid-template-columns:repeat(2,1fr);}}
.achv{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:16px 8px; border-radius:14px; background:var(--bg-soft); border:1px solid var(--border-soft);}
.achv.locked{opacity:.38;}
.achv-icon{width:40px; height:40px; border-radius:12px; background:var(--primary-tint); color:var(--primary-deep); display:flex; align-items:center; justify-content:center;}
.achv-icon svg{width:20px; height:20px;}
.achv span{font-size:12px; font-weight:600; line-height:1.3;}

/* ---------- Tree / Conteúdos ---------- */
.disc-block{margin-bottom:14px; border:1px solid var(--border-soft); border-radius:var(--radius-m); overflow:hidden; background:var(--surface);}
.disc-head{display:flex; align-items:center; gap:12px; padding:16px 16px 16px 20px; cursor:pointer; user-select:none;}
.disc-head-left{flex:1;}
.disc-head h4{font-size:16px;}
.disc-progress{width:110px;}
.disc-chevron{transition:transform .2s ease; color:var(--text-faint); flex-shrink:0; display:flex;}
.disc-chevron svg{width:18px; height:18px;}
.disc-block.open .disc-chevron{transform:rotate(180deg);}
.disc-items{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.disc-block.open .disc-items{max-height:1200px;}
.tree-item{display:flex; align-items:center; gap:12px; padding:12px 16px 12px 44px; border-top:1px solid var(--border-soft);}
.tree-item:hover{background:var(--bg-soft);}
.tree-item-name{flex:1; font-size:14.5px; font-weight:500; cursor:pointer;}
.tree-item-mastery{width:90px;}
.tree-item-pct{font-size:12.5px; color:var(--text-soft); width:32px; text-align:right;}

/* ---------- Content detail ---------- */
.detail-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.detail-crumb{font-size:13px; color:var(--text-faint); margin-bottom:6px;}
.detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
.detail-layout{display:grid; grid-template-columns:2.2fr 1fr; gap:20px; align-items:start;}
@media (max-width:960px){.detail-layout{grid-template-columns:1fr;}}
.theory-section{margin-bottom:20px;}
.theory-section h4{font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}

/* ---------- Flashcards ---------- */
.fc-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; align-items:center;}
.fc-tab{padding:8px 15px; border-radius:100px; font-size:13.5px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--text-soft);}
.fc-tab.active{background:var(--primary-tint); color:var(--primary-ink); border-color:transparent;}
.fc-stage{max-width:560px; margin:0 auto;}
.flashcard{position:relative; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-l); padding:44px 32px; min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; box-shadow:var(--shadow-md);}
.flashcard .fc-kicker{font-size:12px; color:var(--text-faint); font-weight:700; position:absolute; top:20px; left:0; right:0;}
.flashcard h3{font-size:19px; line-height:1.5;}
.flashcard .fc-answer{font-size:15.5px; color:var(--text-soft); line-height:1.6; border-top:1px dashed var(--border); padding-top:16px; margin-top:6px; width:100%;}
.fc-recall-row{display:flex; gap:8px; justify-content:center; margin-top:16px;}
.fc-progress-text{text-align:center; color:var(--text-faint); font-size:13px; margin-top:14px;}

/* ---------- Question bank ---------- */
.filters-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.filters-row select{padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; color:var(--text);}
.q-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:20px; margin-bottom:14px;}
.q-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.q-statement{font-size:15px; line-height:1.6; margin-bottom:16px;}
.q-alts{display:flex; flex-direction:column; gap:8px;}
.q-alt{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--border); border-radius:11px; font-size:14px; color:var(--text-soft); transition:all .12s ease;}
.q-alt:hover{border-color:var(--primary);}
.q-alt-letter{width:22px; height:22px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; color:var(--text-soft);}
.q-alt.correct{background:var(--mint-tint); border-color:var(--mint-deep); color:var(--mint-deep); font-weight:600;}
.q-alt.correct .q-alt-letter{background:var(--mint-deep); color:#fff;}
.q-alt.wrong{background:var(--rose-tint); border-color:var(--rose-deep); color:var(--rose-deep); font-weight:600;}
.q-alt.wrong .q-alt-letter{background:var(--rose-deep); color:#fff;}
.q-explain{margin-top:14px; padding:14px 16px; background:var(--bg-soft); border-radius:11px; font-size:13.8px; color:var(--text-soft); line-height:1.6;}
.q-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}

/* ---------- Simulado ---------- */
.sim-config-section{margin-bottom:26px;}
.sim-config-section h4{font-size:15px; margin-bottom:12px;}
.check-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
@media (max-width:600px){.check-grid{grid-template-columns:1fr;}}
.check-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:11px; font-size:14px; cursor:pointer;}
.check-item input{accent-color:var(--primary-deep); width:16px; height:16px;}
.check-item.checked{border-color:var(--primary); background:var(--primary-tint);}
.pill-group{display:flex; gap:8px; flex-wrap:wrap;}
.pill{padding:9px 16px; border-radius:100px; border:1px solid var(--border); font-size:13.5px; font-weight:600; background:var(--surface); color:var(--text-soft);}
.pill.selected{background:var(--primary-tint); color:var(--primary-ink); border-color:transparent;}

.sim-topbar{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px 22px; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
.sim-timer{font-family:'Lora',serif; font-weight:700; font-size:19px; color:var(--primary-deep); display:flex; align-items:center; gap:8px;}
.sim-progress-dots{display:flex; gap:5px; flex-wrap:wrap; max-width:340px;}
.sim-dot{width:26px; height:26px; border-radius:8px; font-size:11.5px; display:flex; align-items:center; justify-content:center; font-weight:700; background:var(--surface-2); color:var(--text-faint); cursor:pointer;}
.sim-dot.answered{background:var(--primary-tint); color:var(--primary-ink);}
.sim-dot.marked{outline:2px solid var(--amber-deep); outline-offset:1px;}
.sim-dot.current{background:var(--primary-deep); color:#fff;}
.sim-nav-foot{display:flex; justify-content:space-between; margin-top:20px; gap:10px; flex-wrap:wrap;}

.result-hero{display:flex; align-items:center; gap:28px; flex-wrap:wrap; padding:30px; border-radius:var(--radius-l); background:linear-gradient(135deg, var(--mint-tint), var(--surface) 65%); border:1px solid var(--border-soft); margin-bottom:20px;}
.result-score-ring{width:120px; height:120px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:var(--surface); box-shadow:var(--shadow-md);}
.result-score-ring strong{font-family:'Lora',serif; font-size:28px; color:var(--mint-deep);}
.result-score-ring span{font-size:11.5px; color:var(--text-soft);}
.bar-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.bar-row .bar-label{width:180px; font-size:13.8px; font-weight:600; flex-shrink:0;}
.bar-row .bar-pct{width:42px; text-align:right; font-size:13px; color:var(--text-soft); flex-shrink:0;}
.weak-item{display:flex; align-items:flex-start; gap:14px; padding:16px; border:1px solid var(--border-soft); border-radius:var(--radius-m); margin-bottom:12px;}
.weak-item h4{font-size:15px; margin-bottom:4px;}
.weak-item p{font-size:13.5px; color:var(--text-soft); margin-bottom:10px;}
.weak-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* ---------- Plano ---------- */
.plan-block{display:flex; gap:14px; align-items:flex-start; padding:14px 4px; border-bottom:1px solid var(--border-soft);}
.plan-block:last-child{border-bottom:none;}
.plan-time{width:120px; flex-shrink:0; font-size:12.5px; color:var(--text-faint); font-weight:700; padding-top:3px;}
.plan-check{width:26px; height:26px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1px; cursor:pointer;}
.plan-check.done{background:var(--mint-deep); border-color:var(--mint-deep); color:#fff;}
.plan-check svg{width:14px; height:14px;}
.plan-body{flex:1;}
.plan-body h4{font-size:14.8px; margin-bottom:2px;}
.plan-body p{font-size:13.2px; color:var(--text-soft);}
.plan-block.done .plan-body h4, .plan-block.done .plan-body p{text-decoration:line-through; color:var(--text-faint);}

/* ---------- Add concurso / matérias ---------- */
.subj-block{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.subj-row{display:flex; align-items:center; gap:10px; cursor:pointer;}
.subj-row input{accent-color:var(--primary-deep); width:16px; height:16px; flex-shrink:0;}
.subj-row span{font-weight:600; font-size:14px;}
.subj-textarea{margin-top:10px;}

/* ---------- Toast ---------- */
#toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:12px 20px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media (max-width:960px){#toast{bottom:78px;}}

.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.section-title h3{font-size:18px;}
.muted{color:var(--text-soft);}
.small{font-size:13px;}
hr.sep{border:none; border-top:1px solid var(--border-soft); margin:22px 0;}
.empty-card{text-align:center; padding:44px 24px;}
.empty-card h4{font-size:16px; margin-bottom:8px;}
</style>
</head>

function ic(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg>`; }

/* ===================== TOAST ===================== */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = ic('check') + '<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ===================== STATE ===================== */
let contest = {nome:'', orgao:'', cargo:'', banca:'', data:'', obs:''};
let disciplinas = [];
let flashcardsData = [];
let planoHoje = [];
let wrongBank = [];
let favQuestoes = new Set();
let qRevealed = {};
let notas = {};
let stats = {questoesRespondidas:0, acertos:0, flashcardsRevisados:0, simuladosRealizados:0, horasEstudadas:0};
let history = [];
let xp = 0, streak = 0, lastActive = null;
let perfil = {nome:'Thayná', email:''};

const STORAGE_KEY = 'planner-thay-state';
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      contest, disciplinas, flashcards:flashcardsData, plano:planoHoje, wrongBank,
      favQuestoes:[...favQuestoes], qRevealed, notas, stats, history, xp, streak, lastActive, perfil
    }), false);
  }catch(e){ /* armazenamento indisponível — os dados continuam válidos nesta sessão */ }
}
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const d = JSON.parse(res.value);
      contest = d.contest || contest;
      disciplinas = d.disciplinas || [];
      flashcardsData = d.flashcards || [];
      planoHoje = d.plano || [];
      wrongBank = d.wrongBank || [];
      favQuestoes = new Set(d.favQuestoes||[]);
      qRevealed = d.qRevealed || {};
      notas = d.notas || {};
      stats = d.stats || stats;
      history = d.history || [];
      xp = d.xp||0; streak = d.streak||0; lastActive = d.lastActive||null;
      perfil = d.perfil || perfil;
    }
  }catch(e){ /* primeira vez usando o app — segue com os valores padrão zerados */ }
  const today = new Date().toDateString();
  if(lastActive !== today){
    if(lastActive){
      const y = new Date(); y.setDate(y.getDate()-1);
      streak = (lastActive === y.toDateString()) ? streak+1 : 1;
    } else { streak = 1; }
    lastActive = today;
  }
  saveState();
}

function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function findConteudo(id){ for(const d of disciplinas){ const c = d.conteudos.find(c=>c.id===id); if(c) return {c,d}; } return null; }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?w[0].toUpperCase():'').join(''); }
function addXp(n){ xp+=n; }

function addOrMergeDisciplina(nome, linhas){
  nome=(nome||'').trim(); if(!nome) return null;
  let disc = disciplinas.find(d=>d.nome.toLowerCase()===nome.toLowerCase());
  if(!disc){ disc = {id: slug(nome)+'-'+Date.now()+Math.floor(Math.random()*999), nome, conteudos:[]}; disciplinas.push(disc); }
  (linhas||[]).forEach(l=>{
    l=(l||'').trim(); if(!l) return;
    if(!disc.conteudos.find(c=>c.nome.toLowerCase()===l.toLowerCase())){
      disc.conteudos.push({id: slug(nome)+'-'+slug(l)+'-'+Date.now()+Math.floor(Math.random()*999), nome:l, status:'nao', dominio:0});
    }
  });
  return disc;
}

const BOTTOM_NAV_IDS = ['dashboard','conteudos','questoes','simulado-criar'];

function buildNav(){
  document.getElementById('nav-main').innerHTML = NAV_ITEMS.map(n=>`<a class="nav-item" data-nav="${n.id}" onclick="go('${n.id}')">${ic(n.icon)}<span>${n.label}</span></a>`).join('');
  const bottom = document.getElementById('bottom-nav');
  bottom.innerHTML = BOTTOM_NAV_IDS.map(id=>{
    const n = NAV_ITEMS.find(x=>x.id===id);
    return `<a class="bn-item" data-bn="${id}" onclick="go('${id}')">${ic(n.icon)}<span>${n.label.split(' ')[0]}</span></a>`;
  }).join('') + `<a class="bn-item" onclick="openDrawer()">${ic('list')}<span>Mais</span></a>`;
  const drawerIds = NAV_ITEMS.filter(n=>!BOTTOM_NAV_IDS.includes(n.id));
  document.getElementById('nav-drawer').innerHTML = drawerIds.map(n=>`<a class="nav-item" onclick="go('${n.id}'); closeDrawer()">${ic(n.icon)}<span>${n.label}</span></a>`).join('');
  renderThemeIcon();
  renderSidebarContest();
  refreshTopbarAvatar();
}
function openDrawer(){ document.getElementById('drawer-overlay').classList.add('active'); }
function closeDrawer(){ document.getElementById('drawer-overlay').classList.remove('active'); }
function toggleTheme(){ document.body.classList.toggle('dark'); renderThemeIcon(); }
function renderThemeIcon(){ document.getElementById('theme-btn').innerHTML = ic(document.body.classList.contains('dark') ? 'sun' : 'moon'); }

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return Math.max(0, Math.ceil((d - new Date())/86400000));
}
function computeOverall(){
  const all = disciplinas.flatMap(d=>d.conteudos);
  if(!all.length) return null;
  return Math.round(all.reduce((a,c)=>a+c.dominio,0)/all.length);
}
function getWeakest(){
  const all = disciplinas.flatMap(d=>d.conteudos.map(c=>({...c, disc:d.nome})));
  const candidates = all.filter(c=>c.status!=='dominado');
  if(!candidates.length) return null;
  candidates.sort((a,b)=>a.dominio-b.dominio);
  return candidates[0];
}
function prepLevel(){
  const overall = computeOverall();
  if(overall===null) return {level:'vazio', color:'sky', icon:'target', label:'Comece por aqui', text:'Adicione suas matérias e conteúdos para começarmos a acompanhar o seu ritmo de preparação.'};
  const dias = daysUntil(contest.data);
  if(overall>=75) return {level:'bom', color:'mint', icon:'trophy', label:'Bom ritmo', text:'Seu desempenho está dentro ou acima da meta. Continue com a rotina atual.'};
  if(overall>=50) return {level:'atencao', color:'amber', icon:'alert', label:'Atenção', text:'Seu ritmo está um pouco abaixo do ideal'+(dias!==null?' para os '+dias+' dias restantes':'')+'. Aumentar a frequência de revisões pode ajudar.'};
  return {level:'risco', color:'rose', icon:'alert', label:'Risco', text:'Seu progresso está bem abaixo do necessário. Recomendamos intensificar o estudo diário.'};
}
function computeAchievements(){
  return [
    {icon:'trophy', label:'Primeiro estudo', unlocked: disciplinas.some(d=>d.conteudos.some(c=>c.status!=='nao'))},
    {icon:'flame', label:'7 dias seguidos', unlocked: streak>=7},
    {icon:'star', label:'100 questões', unlocked: stats.questoesRespondidas>=100},
    {icon:'target', label:'Primeiro simulado', unlocked: stats.simuladosRealizados>=1},
  ];
}

function drawLineChart(elId, values){
  const el = document.getElementById(elId);
  if(!el) return;
  const w=600, h=210, pad=28;
  const max = Math.max(...values, 100), min = Math.min(...values, 0);
  const stepX = (w-pad*2)/(Math.max(values.length-1,1));
  const norm = v => h-pad - ((v-min)/((max-min)||1))*(h-pad*2);
  let points = values.map((v,i)=>[pad+i*stepX, norm(v)]);
  let path = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let area = path + ` L${points[points.length-1][0].toFixed(1)},${h-pad} L${points[0][0].toFixed(1)},${h-pad} Z`;
  const gridLines = [0,1,2,3].map(i=>{
    const y = pad + i*((h-pad*2)/3);
    return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
  }).join('');
  const dots = points.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--primary-deep)"/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:100%;">
    <defs><linearGradient id="grad-${elId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${area}" fill="url(#grad-${elId})"/>
    <path d="${path}" fill="none" stroke="var(--primary-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

let fcFilter = 'all';

let fcCreating = false;

function fcList(){

function openFcForm(editId){ fcCreating=true; fcEditingId=editId||null; renderFlashcards(true); }
function closeFcForm(){ fcCreating=false; fcEditingId=null; renderFlashcards(true); }
function renderFcForm(){
  const editing = fcEditingId ? flashcardsData.find(f=>f.id===fcEditingId) : null;
  const wrap = document.getElementById('fc-form-wrap');
  wrap.innerHTML = `
    <div class="card" style="max-width:520px; margin:0 auto 20px;">
      <div class="field"><label>Matéria (opcional)</label>

      </div>
      <datalist id="materia-list">${disciplinas.map(d=>`<option>${d.nome}</option>`).join('')}</datalist>
      <div class="field"><label>Pergunta</label><textarea id="fc-pergunta" class="ta-plain" rows="2">${editing?editing.pergunta:''}</textarea></div>
      <div class="field"><label>Resposta</label><textarea id="fc-resposta" class="ta-plain" rows="3">${editing?editing.resposta:''}</textarea></div>

}
function saveFcForm(){
  const materiaNome = document.getElementById('fc-materia').value.trim();
  const pergunta = document.getElementById('fc-pergunta').value.trim();
  const resposta = document.getElementById('fc-resposta').value.trim();
  if(!pergunta || !resposta){ toast('Preencha a pergunta e a resposta'); return; }
  if(fcEditingId){
    const f = flashcardsData.find(x=>x.id===fcEditingId);
    f.materiaNome=materiaNome; f.pergunta=pergunta; f.resposta=resposta;
  } else {
    flashcardsData.push({id:'f'+Date.now(), materiaNome, pergunta, resposta, nivel:'aprendizagem'});

  saveState();

}
function deleteFlashcard(id){
  if(!confirm('Excluir este flashcard?')) return;
  flashcardsData = flashcardsData.filter(f=>f.id!==id);
  saveState(); renderFlashcards(true);
}
function renderFcCard(){
  const list = fcList();
  const stage = document.getElementById('fc-stage');
  if(!list.length){
    stage.innerHTML = `<div class="card empty-card"><h4>Nenhum flashcard aqui ainda</h4><p class="muted small">Crie seu primeiro flashcard para começar a revisar.</p></div>`;
    return;
  }
  const idx = fcIndex % list.length;

  stage.innerHTML = `

      <div style="position:absolute; top:14px; right:14px; display:flex; gap:2px;">

      <div class="fc-recall-row">

function nextFc(grade){

function renderQList(){
  let list = questoesData.filter(q=>
    (!qFilters.disciplina || q.disciplina===qFilters.disciplina) &&
    (!qFilters.dificuldade || q.dificuldade===qFilters.dificuldade) &&
    (!qFilters.banca || q.banca===qFilters.banca) &&
    (qFilters.status!=='favoritas' || favQuestoes.has(q.id)) &&
    (qFilters.status!=='erradas' || wrongBank.includes(q.id))
  );
  const wrap = document.getElementById('q-list');
  if(!list.length){ wrap.innerHTML = `<div class="card empty-card"><p class="muted">Nenhuma questão encontrada com esses filtros.</p></div>`; return; }
  wrap.innerHTML = list.map(q=>`
    <div class="q-card">
      <div class="q-tags">
        <span class="badge badge-faint">${q.disciplina}</span>
        <span class="badge badge-faint">${q.banca} · ${q.ano}</span>
        <span class="badge ${q.dificuldade==='Difícil'?'badge-rose':q.dificuldade==='Médio'?'badge-amber':'badge-mint'}">${q.dificuldade}</span>
      </div>
      <p class="q-statement">${q.enunciado}</p>
      <div class="q-alts">
        ${q.alternativas.map((a,i)=>{
          let cls='';
          if(qRevealed[q.id]!==undefined){ if(i===q.correta) cls='correct'; else if(i===qRevealed[q.id]) cls='wrong'; }
          return `<div class="q-alt ${cls}" onclick="answerQ('${q.id}', ${i})"><span class="q-alt-letter">${String.fromCharCode(65+i)}</span><span>${a}</span></div>`;
        }).join('')}
      </div>
      ${qRevealed[q.id]!==undefined ? `<div class="q-explain"><strong>Explicação:</strong> ${q.explicacao}</div>` : ''}

        <span class="small muted">${d_(q)}</span>
        <button class="btn btn-sm" onclick="toggleFav('${q.id}')">${ic('heart')} ${favQuestoes.has(q.id)?'Favoritada':'Favoritar'}</button>
      </div>
    </div>
  `).join('');
}
function answerQ(qid, idx){
  if(qRevealed[qid]!==undefined) return;
  qRevealed[qid]=idx;
  const q = questoesData.find(x=>x.id===qid);
  const isCorrect = idx===q.correta;
  stats.questoesRespondidas++;
  if(isCorrect){ stats.acertos++; addXp(5); } else { addXp(2); if(!wrongBank.includes(qid)) wrongBank.push(qid); }
  history.push({t:Date.now(), pct: Math.round(stats.acertos/stats.questoesRespondidas*100)});
  if(history.length>30) history.shift();
  saveState();
  renderQList();
}
function toggleFav(qid){ favQuestoes.has(qid)?favQuestoes.delete(qid):favQuestoes.add(qid); saveState(); renderQList(); }

/* ===================== SIMULADO — RODANDO ===================== */
let simState = null;
let simTimerHandle;
function startSimulado(){
  let pool = questoesData.filter(q=>simConfig.disciplinas.has(q.disciplina));
  if(!pool.length) pool = questoesData.slice();
  let picked = [];
  for(let i=0;i<Math.min(simConfig.qtd, 30);i++) picked.push(pool[i % pool.length]);
  simState = {questions:picked, current:0, answers:{}, marked:new Set(), secondsLeft: simConfig.tempo==='sem-limite'?null:parseInt(simConfig.tempo)*60, recorded:false};
  go('simulado-rodando');
  if(simState.secondsLeft!==null) startSimTimer();
}
function startSimTimer(){
  clearInterval(simTimerHandle);
  simTimerHandle = setInterval(()=>{
    if(!simState) return clearInterval(simTimerHandle);
    simState.secondsLeft--;
    if(simState.secondsLeft<=0){ clearInterval(simTimerHandle); submitSimulado(); return; }
    const t = document.getElementById('sim-timer-val');
    if(t) t.textContent = fmtTime(simState.secondsLeft);
  }, 1000);
}
function fmtTime(s){ const m=Math.floor(s/60); const ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function renderSimuladoRodando(){
  if(!simState) return;
  const el = document.getElementById('view-simulado-rodando');
  const q = simState.questions[simState.current];
  el.innerHTML = `
    <div class="sim-topbar">
      <strong>Questão ${simState.current+1} de ${simState.questions.length}</strong>
      ${simState.secondsLeft!==null ? `<span class="sim-timer">${ic('clock')} <span id="sim-timer-val">${fmtTime(simState.secondsLeft)}</span></span>` : `<span class="small muted">${ic('clock')} Sem limite de tempo</span>`}
      <div class="sim-progress-dots" id="sim-dots"></div>
    </div>
    <div class="q-card">
      <div class="q-tags"><span class="badge badge-faint">${q.disciplina}</span><span class="badge badge-faint">${q.banca} · ${q.ano}</span></div>
      <p class="q-statement">${q.enunciado}</p>
      <div class="q-alts">
        ${q.alternativas.map((a,i)=>`<div class="q-alt" style="${simState.answers[simState.current]===i?'background:var(--primary-tint); border-color:var(--primary); color:var(--primary-ink); font-weight:600;':''}" onclick="pickSimAnswer(${i})"><span class="q-alt-letter">${String.fromCharCode(65+i)}</span><span>${a}</span></div>`).join('')}
      </div>
    </div>
    <div class="sim-nav-foot">
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="simNav(-1)" ${simState.current===0?'disabled style="opacity:.4"':''}>${ic('chevronLeft')} Anterior</button>
        <button class="btn" onclick="toggleMark()">${ic('flag')} ${simState.marked.has(simState.current)?'Desmarcar':'Marcar para revisão'}</button>
      </div>
      ${simState.current===simState.questions.length-1
        ? `<button class="btn btn-primary" onclick="submitSimulado()">Finalizar simulado ${ic('check')}</button>`
        : `<button class="btn btn-primary" onclick="simNav(1)">Próxima ${ic('chevronRight')}</button>`}
    </div>`;
  document.getElementById('sim-dots').innerHTML = simState.questions.map((_,i)=>{
    let cls='sim-dot';
    if(i===simState.current) cls+=' current'; else if(simState.answers[i]!==undefined) cls+=' answered';
    if(simState.marked.has(i)) cls+=' marked';
    return `<div class="${cls}" onclick="simState.current=${i}; renderSimuladoRodando();">${i+1}</div>`;
  }).join('');
}
function pickSimAnswer(i){ simState.answers[simState.current]=i; renderSimuladoRodando(); }
function simNav(dir){ simState.current = Math.max(0, Math.min(simState.questions.length-1, simState.current+dir)); renderSimuladoRodando(); }
function toggleMark(){ simState.marked.has(simState.current) ? simState.marked.delete(simState.current) : simState.marked.add(simState.current); renderSimuladoRodando(); }

function computeSimResults(){
  const total = simState.questions.length;
  let correct=0, wrong=0, blank=0;
  const byDisc={}, byConteudo={};
  simState.questions.forEach((q,i)=>{
    const ans = simState.answers[i];
    const isCorrect = ans===q.correta;
    if(ans===undefined) blank++; else if(isCorrect) correct++; else wrong++;
    byDisc[q.disciplina]=byDisc[q.disciplina]||{c:0,t:0}; byDisc[q.disciplina].t++; if(isCorrect) byDisc[q.disciplina].c++;
    const key=q.disciplina+'|'+q.conteudoNome;
    byConteudo[key]=byConteudo[key]||{c:0,t:0,disciplina:q.disciplina,conteudoNome:q.conteudoNome}; byConteudo[key].t++; if(isCorrect) byConteudo[key].c++;
  });
  return {total,correct,wrong,blank,byDisc,byConteudo};
}
function submitSimulado(){
  clearInterval(simTimerHandle);
  if(simState && !simState.recorded){
    simState.questions.forEach((q,i)=>{
      const ans = simState.answers[i];
      if(ans!==undefined){
        const isCorrect = ans===q.correta;
        stats.questoesRespondidas++;
        if(isCorrect){ stats.acertos++; addXp(5); } else { addXp(2); if(!wrongBank.includes(q.id)) wrongBank.push(q.id); }
      }
    });
    stats.simuladosRealizados++; addXp(15);
    history.push({t:Date.now(), pct: stats.questoesRespondidas? Math.round(stats.acertos/stats.questoesRespondidas*100):0});
    if(history.length>30) history.shift();
    simState.recorded = true;
    saveState();
  }
  go('simulado-resultado');
}
function renderSimuladoResultado(){
  const el = document.getElementById('view-simulado-resultado');
  if(!simState){ el.innerHTML='<div class="card empty-card"><p class="muted">Nenhum simulado recente. Crie um simulado para ver seu resultado aqui.</p></div>'; return; }
  const r = computeSimResults();
  const pct = r.total ? Math.round((r.correct/r.total)*100) : 0;
  const weakConteudos = Object.values(r.byConteudo).map(v=>({...v, pct: Math.round((v.c/v.t)*100)})).sort((a,b)=>a.pct-b.pct);

  el.innerHTML = `
    <div class="result-hero">
      <div class="result-score-ring"><strong>${pct}%</strong><span>aproveitamento</span></div>
      <div>
        <div class="eyebrow">Simulado finalizado</div>
        <h2 style="font-size:24px; margin:4px 0 10px;">${r.correct} de ${r.total} acertos</h2>
        <div style="display:flex; gap:18px; flex-wrap:wrap;">
          <span class="small"><strong style="color:var(--mint-deep)">${r.correct}</strong> certas</span>
          <span class="small"><strong style="color:var(--rose-deep)">${r.wrong}</strong> erradas</span>
          <span class="small"><strong style="color:var(--text-faint)">${r.blank}</strong> em branco</span>
        </div>
      </div>
    </div>
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="card-title-row"><h3>Desempenho por disciplina</h3></div>
        ${Object.entries(r.byDisc).map(([disc,v])=>{
          const p = Math.round((v.c/v.t)*100);
          return `<div class="bar-row"><span class="bar-label">${disc}</span><div class="progress" style="flex:1;"><span style="width:${p}%"></span></div><span class="bar-pct">${p}%</span></div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title-row"><h3>Você precisa revisar</h3></div>
        ${weakConteudos.slice(0,3).map(w=>{
          const color = w.pct<60?'rose':w.pct<80?'amber':'mint';
          return `<div class="weak-item">
            <span class="badge badge-${color}">${w.pct}%</span>
            <div style="flex:1;">
              <h4>${w.conteudoNome}</h4>
              <p>${w.disciplina} · Você acertou ${w.c} de ${w.t} questões deste conteúdo.</p>
              <div class="weak-actions">
                <button class="btn btn-sm" onclick="qFilters.disciplina='${w.disciplina}'; go('questoes')">Ver questões</button>
                <button class="btn btn-sm" onclick="go('flashcards')">Flashcards</button>
                <button class="btn btn-sm" onclick="addWeakToPlano('${w.disciplina.replace(/'/g,"\\'")}','${w.conteudoNome.replace(/'/g,"\\'")}')">+ Ao plano</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
      <button class="btn" onclick="go('caderno')">Ver caderno de erros</button>
      <button class="btn btn-primary" onclick="go('simulado-criar')">Criar novo simulado</button>
    </div>`;
}
function addWeakToPlano(disciplina, conteudoNome){
  planoHoje.push({id:'p'+Date.now(), hora:'A definir', titulo:'Revisar '+conteudoNome, sub:disciplina, done:false});
  saveState();
  toast('Adicionado ao plano de estudos!');
}

/* ===================== CADERNO DE ERROS ===================== */
function renderCaderno(){
  const el = document.getElementById('view-caderno');
  const list = questoesData.filter(q=>wrongBank.includes(q.id));
  el.innerHTML = `
    <div class="section-title">
      <div><h3>Caderno de erros</h3><p class="small muted">Você possui ${list.length} questão(ões) para revisar.</p></div>
    </div>
    <div id="caderno-list"></div>`;
  const wrap = document.getElementById('caderno-list');
  if(!list.length){ wrap.innerHTML = `<div class="card empty-card"><p class="muted">Nenhuma questão errada por aqui ainda. Bom trabalho!</p></div>`; return; }
  wrap.innerHTML = list.map(q=>`
    <div class="q-card">
      <div class="q-tags"><span class="badge badge-rose">Errada</span><span class="badge badge-faint">${q.disciplina}</span><span class="badge badge-faint">${q.banca} · ${q.ano}</span></div>
      <p class="q-statement">${q.enunciado}</p>
      <div class="q-alts">${q.alternativas.map((a,i)=>`<div class="q-alt ${i===q.correta?'correct':''}"><span class="q-alt-letter">${String.fromCharCode(65+i)}</span><span>${a}</span></div>`).join('')}</div>
      <div class="q-explain"><strong>Explicação:</strong> ${q.explicacao}</div>
      <div class="q-foot">
        <span class="small muted">${d_(q)}</span>
        <button class="btn btn-sm" onclick="wrongBank=wrongBank.filter(id=>id!=='${q.id}'); saveState(); renderCaderno(); toast('Marcado como revisado')">${ic('check')} Marcar como revisado</button>
      </div>
    </div>`).join('');
}

/* ===================== PLANO DE ESTUDOS ===================== */
function renderPlano(){
  const el = document.getElementById('view-plano');
  const doneCount = planoHoje.filter(p=>p.done).length;
  el.innerHTML = `
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="card-title-row"><div><h3>Meu plano de hoje</h3><p class="small muted">${doneCount} de ${planoHoje.length} atividades concluídas</p></div></div>
        <div id="plano-list"></div>
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);">
          <div class="field-row">
            <div class="field"><label>Horário</label><input id="plano-hora" type="text" placeholder="Ex: 19:00 – 19:40"></div>
            <div class="field"><label>Atividade</label><input id="plano-titulo" type="text" placeholder="Ex: Direito Constitucional"></div>
          </div>
          <div class="field"><label>Descrição (opcional)</label><input id="plano-sub" type="text" placeholder="Ex: Direitos Fundamentais — 10 questões"></div>
          <button class="btn btn-primary btn-block" onclick="addPlanoItem()">${ic('plus')} Adicionar atividade</button>
        </div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:12px;">Como usar seu plano</div>
        <p class="small muted" style="line-height:1.7;">Monte sua rotina diária adicionando horários, matérias e atividades. Marque cada item como concluído para acompanhar seu progresso e acumular horas estudadas automaticamente.</p>
      </div>
    </div>`;
  renderPlanoList();
}
function addPlanoItem(){
  const hora=document.getElementById('plano-hora').value.trim()||'Sem horário';
  const titulo=document.getElementById('plano-titulo').value.trim();
  const sub=document.getElementById('plano-sub').value.trim();
  if(!titulo){ toast('Digite o nome da atividade'); return; }
  planoHoje.push({id:'p'+Date.now(), hora, titulo, sub, done:false});
  saveState(); renderPlano();
}
function renderPlanoList(){
  const wrap = document.getElementById('plano-list');
  if(!planoHoje.length){ wrap.innerHTML = `<p class="muted small" style="padding:14px 0;">Nenhuma atividade adicionada ainda.</p>`; return; }
  wrap.innerHTML = planoHoje.map(p=>`
    <div class="plan-block ${p.done?'done':''}">
      <span class="plan-time">${p.hora}</span>
      <div class="plan-check ${p.done?'done':''}" onclick="togglePlan('${p.id}')">${p.done?ic('check'):''}</div>
      <div class="plan-body"><h4>${p.titulo}</h4><p>${p.sub||''}</p></div>
      <button class="mini-trash" onclick="deletePlanoItem('${p.id}')">${ic('trash')}</button>
    </div>`).join('');
}
function parseDuration(hora){
  const m = hora.match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
  if(!m) return 30;
  const start = parseInt(m[1])*60+parseInt(m[2]);
  const end = parseInt(m[3])*60+parseInt(m[4]);
  return Math.max(0, end-start);
}
function togglePlan(id){
  const p = planoHoje.find(x=>x.id===id); p.done=!p.done;
  const mins = parseDuration(p.hora);
  stats.horasEstudadas += (p.done?mins:-mins)/60;
  if(stats.horasEstudadas<0) stats.horasEstudadas=0;
  saveState(); renderPlano();
}
function deletePlanoItem(id){ planoHoje = planoHoje.filter(x=>x.id!==id); saveState(); renderPlano(); }

/* ===================== DESEMPENHO ===================== */
function renderDesempenho(){
  const el = document.getElementById('view-desempenho');
  const all = disciplinas.flatMap(d=>d.conteudos.map(c=>({...c, disc:d.nome})));
  const fortes = all.filter(c=>c.dominio>=80).sort((a,b)=>b.dominio-a.dominio);
  const fracos = all.filter(c=>c.dominio>0 && c.dominio<65).sort((a,b)=>a.dominio-b.dominio);
  const acerto = stats.questoesRespondidas ? Math.round(stats.acertos/stats.questoesRespondidas*100) : null;

  el.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="card stat-card"><span class="stat-label">Taxa de acerto geral</span><span class="stat-num">${acerto===null?'—':acerto+'%'}</span></div>
      <div class="card stat-card"><span class="stat-label">Questões respondidas</span><span class="stat-num">${stats.questoesRespondidas}</span></div>
      <div class="card stat-card"><span class="stat-label">Horas estudadas</span><span class="stat-num">${stats.horasEstudadas.toFixed(1)}h</span></div>
      <div class="card stat-card"><span class="stat-label">Conteúdos dominados</span><span class="stat-num">${all.filter(c=>c.status==='dominado').length}/${all.length}</span></div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-title-row"><h3>Evolução da taxa de acerto</h3></div>
      <div class="chart-wrap" id="desemp-chart">${history.length<2?'<p class="muted small">Comece a responder questões para ver sua evolução aqui.</p>':''}</div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-title-row"><h3>Desempenho por disciplina</h3></div>
      ${disciplinas.length ? disciplinas.map(d=>{
        const avg = d.conteudos.length ? Math.round(d.conteudos.reduce((a,c)=>a+c.dominio,0)/d.conteudos.length) : 0;
        return `<div class="bar-row"><span class="bar-label">${d.nome}</span><div class="progress" style="flex:1;"><span style="width:${avg}%"></span></div><span class="bar-pct">${avg}%</span></div>`;
      }).join('') : '<p class="muted small">Adicione suas matérias para ver o desempenho por disciplina.</p>'}
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title-row"><h3>Seus pontos fortes</h3></div>
        ${fortes.map(c=>`<div class="tree-item" style="padding-left:0;"><span class="dot dot-mint"></span><span class="tree-item-name" style="cursor:default;">${c.nome}</span><span class="small muted">${c.disc}</span><span class="tree-item-pct">${c.dominio}%</span></div>`).join('') || '<p class="muted small">Continue estudando para desbloquear pontos fortes.</p>'}
      </div>
      <div class="card">
        <div class="card-title-row"><h3>Conteúdos para revisar</h3></div>
        ${fracos.map(c=>`<div class="tree-item" style="padding-left:0;"><span class="dot dot-rose"></span><span class="tree-item-name" style="cursor:default;">${c.nome}</span><span class="small muted">${c.disc}</span><span class="tree-item-pct">${c.dominio}%</span></div>`).join('') || '<p class="muted small">Nenhum ponto crítico no momento.</p>'}
      </div>
    </div>`;
  if(history.length>=2) drawLineChart('desemp-chart', history.map(h=>h.pct));
}

/* ===================== PERFIL ===================== */
function renderPerfil(){
  const el = document.getElementById('view-perfil');
  el.innerHTML = `
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px;">
          <div class="avatar" style="width:56px; height:56px; font-size:19px;">${initials(perfil.nome)}</div>
          <div><h3 style="font-size:18px;">${perfil.nome}</h3><p class="small muted">${perfil.email||'Sem e-mail cadastrado'}</p></div>
        </div>
        <div class="field"><label>Nome</label><input id="perfil-nome" value="${perfil.nome}"></div>
        <div class="field"><label>E-mail</label><input id="perfil-email" value="${perfil.email||''}"></div>
        <button class="btn btn-primary" onclick="salvarPerfil()">Salvar alterações</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="card">
          <div class="eyebrow" style="margin-bottom:14px;">Preferências</div>
          <label style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; cursor:pointer;" onclick="toggleTheme()">
            <span class="small" style="font-weight:600;">Tema escuro</span>
            <input type="checkbox" ${document.body.classList.contains('dark')?'checked':''} style="width:18px; height:18px; accent-color:var(--primary-deep);" onclick="event.stopPropagation(); toggleTheme();">
          </label>
        </div>
        <div class="card">
          <div class="eyebrow" style="margin-bottom:14px;">Suas conquistas</div>
          <div class="achv-grid">
            ${computeAchievements().map(a=>`<div class="achv ${a.unlocked?'':'locked'}"><div class="achv-icon">${ic(a.icon)}</div><span>${a.label}</span></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="eyebrow" style="margin-bottom:10px;">Meus dados</div>
          <button class="btn btn-block" onclick="exportarDados()">${ic('download')} Exportar meus dados</button>
          <button class="btn btn-block btn-danger-ghost" style="margin-top:8px;" onclick="apagarDados()">${ic('trash')} Apagar todos os dados</button>
        </div>
      </div>
    </div>`;
}
function salvarPerfil(){
  perfil.nome = document.getElementById('perfil-nome').value.trim() || perfil.nome;
  perfil.email = document.getElementById('perfil-email').value.trim();
  saveState();
  refreshTopbarAvatar();
  go('perfil');
  toast('Perfil atualizado');
}
function exportarDados(){
  const data = {contest, disciplinas, flashcards:flashcardsData, plano:planoHoje, stats, perfil};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='planner-thay-dados.json'; a.click();
  URL.revokeObjectURL(url);
}
async function apagarDados(){
  if(!confirm('Isso vai apagar todos os seus dados salvos neste app. Deseja continuar?')) return;
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
  location.reload();
}

/* ===================== INIT ===================== */
buildNav();
loadState().then(()=>{ buildNav(); go('dashboard'); });
</script>
</body>
